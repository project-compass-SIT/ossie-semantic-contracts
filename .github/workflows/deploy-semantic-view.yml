name: Deploy Snowflake semantic view

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'semantic_views/sit_test1.yaml'
      - 'scripts/snowflake/deploy_snowflake_semantic_view.py'
      - 'requirements-deploy.txt'
      - '.github/workflows/deploy-semantic-view.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: snowflake-semantic-view-sit
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sit
    timeout-minutes: 15

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-deploy.txt

      - name: Verify and deploy semantic view
        run: >
          python scripts/snowflake/deploy_snowflake_semantic_view.py
          --yaml snowflake_yaml/SIT_TEST1_0.2.0.dev0_snowflake.yaml
          --target-schema SIT.COMPASS
          --verify-only
