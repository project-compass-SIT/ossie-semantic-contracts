name: Convert and deploy SIT_TEST1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ossie_yaml/SIT_TEST1_0.2.0.dev0_ossie_yaml.yaml'
      - 'scripts/snowflake/converter.py'
      - 'scripts/snowflake/deploy_snowflake_semantic_view.py'
      - 'requirements-deploy.txt'
      - '.github/workflows/deploy-semantic-view.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: sit-test1-semantic-view
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: sit
    timeout-minutes: 15

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-deploy.txt

      - name: Convert Ossie YAML
        run: |
          python scripts/snowflake/converter.py \
            -i ossie_yaml/SIT_TEST1_0.2.0.dev0_ossie_yaml.yaml \
            -o snowflake_yaml/SIT_TEST1_0.2.0.dev0_snowflake.yaml
          test -s snowflake_yaml/SIT_TEST1_0.2.0.dev0_snowflake.yaml

      - name: Verify and deploy generated YAML
        run: >
          python scripts/snowflake/deploy_snowflake_semantic_view.py
          --yaml snowflake_yaml/SIT_TEST1_0.2.0.dev0_snowflake.yaml
          --target-schema SIT.COMPASS
