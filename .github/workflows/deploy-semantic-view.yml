name: Deploy - Snowflake Ossie Semantic View

on:
  push:
    branches: [main]
    paths:
      - 'ossie_yaml/SALES_AND_ORDERS.yaml'
      - 'scripts/snowflake/converter.py'
      - 'scripts/snowflake/deploy_snowflake_semantic_view.py'
      - 'requirements-deploy.txt'
      - '.github/workflows/deploy-semantic-view.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sit-test1-semantic-view
  cancel-in-progress: false

jobs:
  convert-and-deploy:
    runs-on: ubuntu-24.04
    environment: sit
    timeout-minutes: 15

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-deploy.txt

      - name: Convert Ossie YAML
        run: |
          python scripts/snowflake/converter.py \
            -i ossie_yaml/SALES_AND_ORDERS.yaml \
            -o snowflake_yaml/SALES_AND_ORDERS_snowflake.yaml
          test -s snowflake_yaml/SALES_AND_ORDERS_snowflake.yaml

      - name: Commit generated YAML if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- snowflake_yaml/SALES_AND_ORDERS_snowflake.yaml

          if git diff --cached --quiet; then
            echo "Generated YAML is unchanged; nothing to commit."
          else
            git commit -m "Generate Snowflake YAML for SIT_TEST1"
            git push origin HEAD:main
          fi

      - name: Verify and deploy generated YAML
        run: >
          python scripts/snowflake/deploy_snowflake_semantic_view.py
          --yaml snowflake_yaml/SALES_AND_ORDERS_snowflake.yaml
          --target-schema SIT.COMPASS
