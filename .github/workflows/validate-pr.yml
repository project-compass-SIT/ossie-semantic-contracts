name: Validate OSSIE YAML

# Step 6: runs on every PR into main. Add this as a required status check
# under Settings -> Branches so PRs can't merge (even via auto-merge)
# until it passes.

on:
  pull_request:
    branches: [main]
    paths:
      - "ossie/**.yaml"
      - "ossie/**.yml"

jobs:
  validate-ossie-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate OSSIE YAML structure
        run: python scripts/validate_ossie_yaml.py ossie/

      - name: Snowflake structural check (verify-only)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: python scripts/deploy_snowflake_semantic_view.py --yaml-dir ossie/ --verify-only
