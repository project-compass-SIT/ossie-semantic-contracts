name: Validate OSSIE YAML

# Step 6: runs on every PR into main. Add this as a required status check
# under Settings -> Branches so PRs can't merge (even via auto-merge)
# until it passes.

on:
  pull_request:
    branches: [main]
    paths:
      - "ossie/**.yaml"
      - "ossie/**.yml"

jobs:
  validate-ossie-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate OSSIE YAML structure
        run: python scripts/validate_ossie_yaml.py ossie/

      # NOTE: SYSTEM$CREATE_SEMANTIC_VIEW_FROM_OSSIE_YAML does not document a
      # verify-only / dry-run mode, so there is no live Snowflake check here -
      # this job is structural validation only. The first real check against
      # Snowflake happens in deploy.yml, after merge. If you want a pre-merge
      # Snowflake-side check, the option is to deploy to a scratch/dev schema
      # here and compare/drop it, rather than a true dry run.
